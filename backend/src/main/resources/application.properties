server.port=${PORT:8114}
server.address=${HOST:127.0.0.1}
server.error.include-message=never
spring.application.name=railway-reservation

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/railway?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:rail_app}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.servlet.multipart.enabled=false
spring.mvc.problemdetails.enabled=false

railway.zone=${RAIL_ZONE:Asia/Kolkata}
railway.booking-window-days=120
railway.max-passengers=6
railway.max-waitlist=20
railway.session-hours=12
railway.cors-origins=${CORS_ORIGINS:http://localhost:5114,http://127.0.0.1:5114}
# Seeded once on start-up if both are set (password min. 10 characters).
railway.admin-email=${RAIL_ADMIN_EMAIL:}
railway.admin-password=${RAIL_ADMIN_PASSWORD:}
railway.seed-sample-data=${RAIL_SEED:true}
